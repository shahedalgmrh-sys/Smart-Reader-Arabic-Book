services:
  app:
    build: .
    container_name: book_audio_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB URL to use the postgres container
      - DATABASE_URL=postgresql://user:password@db:5432/bookdb
    depends_on:
      - db
    volumes:
      - ./generated_audio:/app/generated_audio
      - ./uploaded_covers:/app/uploaded_covers
      # Mount third_party if needed for local development changes
      # - ./third_party:/app/third_party

  db:
    image: postgres:15-alpine
    container_name: book_audio_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bookdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
